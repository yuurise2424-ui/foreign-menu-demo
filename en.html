<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Risho Main Store Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Shippori+Mincho:wght@500;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Design sample 4 (design-samples/4-white-premium.html) applied to the whole menu */
:root{--fs:1.07;--paper:#f8f5ef;--ink:#1d1b18;--sub:#6f685e;--rule:#d8d1c5;--red:#8e1f1a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:calc(16px*var(--fs))/1.6 "Source Serif 4","Shippori Mincho",serif}
html[lang=ja] body{font-size:calc(15px*var(--fs));line-height:1.75}
img{display:block;max-width:100%}
main{max-width:560px;margin:0 auto;padding:0 0 64px}
.pad{padding:0 24px}

header{padding:40px 24px 26px;text-align:center}
header .logo{height:96px;width:auto;margin:0 auto;filter:brightness(0)}
header h1{font:600 calc(14px*var(--fs)) "Source Serif 4",serif;letter-spacing:.32em;text-transform:uppercase;margin-top:16px;color:var(--sub)}
header .line{width:40px;height:1px;background:var(--red);margin:16px auto 0}

/* category nav */
.catnav{position:sticky;top:0;z-index:5;background:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.catnav ul{position:relative;list-style:none;display:flex;overflow-x:auto;scrollbar-width:none;max-width:560px;margin:0 auto;padding:0 12px}
.catnav ul::-webkit-scrollbar{display:none}
.catnav a{display:block;white-space:nowrap;padding:15px 13px 13px;font-size:calc(16px*var(--fs));font-weight:600;color:var(--sub);text-decoration:none;border-bottom:2px solid transparent}
.catnav a.active{color:var(--ink);border-bottom:3px solid var(--red);padding-bottom:12px}
.catnav .groups{display:flex;max-width:560px;margin:0 auto;padding:8px 16px 0;gap:8px}
.catnav .groups button{flex:1;font:600 calc(15px*var(--fs)) "Source Serif 4",serif;letter-spacing:.12em;text-transform:uppercase;padding:9px 0;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.catnav .groups button.on{background:var(--ink);color:var(--paper)}
.catnav li[hidden]{display:none}

#page-drink .group-title{margin-top:28px}

.howto{margin:28px 24px 0;padding:20px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.howto h2{font-weight:600;font-size:calc(18px*var(--fs));color:var(--red);margin-bottom:8px}
.howto ol{list-style:none;counter-reset:s}
.howto li{counter-increment:s;position:relative;padding-left:28px;margin:7px 0;font-size:calc(15px*var(--fs))}
.howto li::before{content:counter(s) ".";position:absolute;left:4px;top:0;font-weight:600;color:var(--red)}
.howorder{margin:20px 24px 0;padding:14px 18px;border:1px solid var(--ink)}
.howorder h2{font-weight:600;font-size:calc(16px*var(--fs));margin-bottom:4px}
.notmo{font-weight:600;color:var(--red);font-size:calc(14px*var(--fs));margin-bottom:6px}
.orderbar .in>span small{display:block;font-size:calc(12px*var(--fs));color:#e9c9c5}
.staff .notmo{margin:8px 0 2px}
.howorder .alt{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);font-size:calc(14px*var(--fs))}
.howorder ol{list-style:none;counter-reset:o}
.howorder li{counter-increment:o;position:relative;padding-left:24px;margin:4px 0;font-size:calc(14px*var(--fs))}
.howorder li::before{content:counter(o) ".";position:absolute;left:2px;font-weight:600}
.legend{margin:14px 24px 0;font-size:calc(14px*var(--fs));color:var(--sub);display:flex;align-items:flex-start;gap:8px}
.rec-icon{display:inline-block;width:18px;height:19px;vertical-align:-3px;flex:none}
.legend .rec-icon{margin-top:3px}

.group-title{margin:64px 24px 0;display:flex;align-items:center;gap:14px;font-weight:600;font-size:calc(13px*var(--fs));letter-spacing:.3em;text-transform:uppercase;color:var(--sub)}
.group-title::before,.group-title::after{content:"";flex:1;height:1px;background:var(--ink)}

section{margin-top:48px;scroll-margin-top:48px}
.hero{position:relative}
.hero img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#ddd}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(20,12,10,.78))}
.hero .label{position:absolute;left:24px;right:24px;bottom:18px;z-index:1;color:#fff}
.hero-cap{padding:6px 24px 0;font-size:calc(13px*var(--fs));color:var(--sub);text-align:right}
.hero-cap b{font-weight:600;color:var(--ink)}
.jnote{margin-top:16px;padding:14px 18px;border:1px solid var(--ink);font-size:calc(15px*var(--fs));color:#3b3732}
.label span{font-size:calc(13px*var(--fs));letter-spacing:.2em;color:#f1e6dc;font-family:"Shippori Mincho",serif}
.label h2{font-weight:600;font-size:calc(28px*var(--fs));line-height:1.2}
.plain{padding:0 24px}
.plain span{font-size:calc(13px*var(--fs));letter-spacing:.2em;color:var(--sub);font-family:"Shippori Mincho",serif}
.plain h2{font-weight:600;font-size:calc(26px*var(--fs));line-height:1.25;color:var(--ink)}
.plain::after{content:"";display:block;width:40px;height:1px;background:var(--red);margin-top:12px}
.styles{margin-top:12px;font-size:calc(14px*var(--fs));color:#3b3732;padding:8px 12px;border-left:2px solid var(--red)}
.styles b{font-weight:600;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin:6px 0 4px}
.chips button{font:inherit;font-size:calc(13px*var(--fs));padding:5px 10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.chips button:active{transform:scale(.95)}
.vrow.st{padding-left:12px}
.vrow[hidden]{display:none}
.hint{font-size:calc(13px*var(--fs));color:var(--sub);margin-top:6px}
.hint a{color:var(--red)}
.lead{margin-top:16px;font-size:calc(15px*var(--fs));color:#3b3732}
.caution{margin-top:10px;font-size:calc(14px*var(--fs));font-weight:600;color:var(--red)}

.feature{margin-top:24px;padding:22px 22px 20px;border:1px solid var(--ink);outline:1px solid var(--ink);outline-offset:-6px;text-align:center}
.feature h3{font-weight:600;font-size:calc(17px*var(--fs));color:var(--red)}
.feature p{font-size:calc(15px*var(--fs));color:#3b3732;margin-top:4px}

.item{padding:20px 0;border-bottom:1px solid var(--rule)}
.item .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.item h3{font-weight:600;font-size:calc(18px*var(--fs));line-height:1.35}
.item h3 .rec-icon{margin-right:6px}
.item .price{white-space:nowrap;font-size:calc(16px*var(--fs));text-align:right;line-height:1.4}
.item .price small{display:block;font-size:calc(12px*var(--fs));color:var(--sub)}
.item .price small.min{color:var(--red)}
.item .jp{font:700 calc(14px*var(--fs)) "Shippori Mincho",serif;color:#4a443c;letter-spacing:.08em;margin-top:3px}
.item p{color:#3b3732;margin-top:8px;font-size:calc(15px*var(--fs))}
.item .grill{margin-top:10px;font-size:calc(14px*var(--fs));color:var(--sub)}
.item .grill b{color:var(--ink);font-weight:600}
.lim{display:inline-block;font-size:calc(11px*var(--fs));letter-spacing:.14em;text-transform:uppercase;padding:1px 8px;margin-bottom:6px;border:1px solid var(--red);color:var(--red)}
.contents{margin-top:8px;font-size:calc(14px*var(--fs));color:#3b3732}
.contents li{list-style:none;padding-left:14px;position:relative}
.contents li::before{content:"";position:absolute;left:2px;top:.75em;width:5px;height:1px;background:var(--red)}
.origin{font-size:calc(13px*var(--fs));color:var(--sub);margin-top:2px}
.meta{margin-top:10px;font-size:calc(14px*var(--fs));display:grid;grid-template-columns:auto 1fr;gap:2px 12px;color:#3b3732}
.meta dt{color:var(--red)}
.addon{margin-top:20px;padding:14px 16px;border:1px solid var(--red);color:var(--red);font-size:calc(15px*var(--fs))}
.photo{margin-top:20px}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#ddd}
.photo figcaption{font-size:calc(13px*var(--fs));color:var(--sub);margin-top:6px}
.sec-legend{margin-top:14px;font-size:calc(13px*var(--fs));color:var(--sub);display:flex;align-items:center;gap:6px}

footer{margin-top:56px;padding:20px 24px;border-top:1px solid var(--rule);font-size:calc(13px*var(--fs));color:var(--sub);text-align:center}
.float{position:fixed;right:14px;bottom:14px;z-index:10;display:flex;flex-direction:column;gap:6px}
.float a,.float button{width:40px;height:40px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--ink);color:var(--ink);font:600 12px "Source Serif 4",serif;text-decoration:none;cursor:pointer}
.float .fs{display:flex;flex-direction:column}
.float .fs button+button{border-top:0}

/* ---- order list: guests add dishes, then show the list to staff (nothing is sent anywhere) ---- */
.order{margin-top:12px;display:flex;justify-content:flex-end}
.vrows{margin-top:12px;border-top:1px dashed var(--rule)}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:calc(15px*var(--fs))}
.vrow small{color:var(--sub);font-size:calc(13px*var(--fs));margin-left:6px}
.step{display:inline-flex;align-items:center;flex:none}
.step button{font:inherit;cursor:pointer;background:var(--paper);color:var(--ink);border:1px solid var(--ink)}
.step .addbtn{padding:5px 16px;font-size:calc(14px*var(--fs));font-weight:600}
.step .pm{width:34px;height:34px;font-size:calc(18px*var(--fs));line-height:1}
.step b{min-width:34px;text-align:center;font-size:calc(16px*var(--fs))}
.step.on .pm{background:var(--ink);color:var(--paper)}
.orderbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper)}
.orderbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.orderbar button{font:600 calc(15px*var(--fs)) "Source Serif 4",serif;background:var(--paper);color:var(--ink);border:0;padding:10px 16px;cursor:pointer}
body.has-order{padding-bottom:64px}
body.has-order .float{bottom:76px}
.staff{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto}
.staff .in{max-width:560px;margin:0 auto;padding:12px 16px 72px}
.staff h2{font:700 19px "Source Serif 4","Shippori Mincho",serif;border-bottom:2px solid var(--ink);padding-bottom:4px}
.staff .sub{font-size:12px;line-height:1.4;color:var(--sub);margin-top:4px}
.srow{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
.srow .sj{font:700 18px/1.3 "Shippori Mincho",serif}
.srow .q{font:700 19px "Source Serif 4",serif;white-space:nowrap}
.srow .se{grid-column:1/3;font-size:12px;line-height:1.3;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:8px}
.srow .step .pm{width:26px;height:24px;font-size:15px}
.staff .total{margin-top:8px;font-size:14px;text-align:right}
.staff .total small{display:block;color:var(--sub);font-size:11px}
.staff .btns{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule)}
.staff .btns .in2{max-width:560px;margin:0 auto;display:flex;gap:10px;padding:8px 16px}
.staff .btns button{flex:1;font:600 14px "Source Serif 4",serif;padding:9px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.staff .btns .clear{flex:none;color:var(--red);border-color:var(--red)}
.staff .btns .done{flex:1.4;background:var(--ink);color:var(--paper);line-height:1.2;font-family:"Shippori Mincho",serif}
.staff .btns .done small{display:block;font:400 10px "Source Serif 4",serif;color:#e9c9c5}
.staff .btns button[hidden]{display:none}
.staff .donenote{margin-top:12px;padding:8px 10px;border:1px dashed var(--sub);font-size:13px;line-height:1.5}
.staff .donenote[hidden]{display:none}
#ordered h3{font:700 16px "Source Serif 4","Shippori Mincho",serif;margin:24px 0 2px;padding-bottom:3px;border-bottom:1px solid var(--ink)}
#ordered .round{font-size:12px;color:var(--sub);margin:10px 0 0}
#ordered .srow .sj,#ordered .srow .q{color:var(--sub)}
#ordered .linkbtn{background:none;border:0;padding:0;margin-top:8px;color:var(--red);text-decoration:underline;font:inherit;font-size:12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:84px;z-index:40;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);padding:10px 14px;font-size:14px;line-height:1.4;
  opacity:0;visibility:hidden;transform:translate(-50%,16px);transition:opacity .25s,transform .25s,visibility 0s .25s}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .25s,transform .25s}
.toast button{flex:none;background:none;border:0;color:#e9c9c5;text-decoration:underline;font:inherit;cursor:pointer}

/* ---- motion: short and quiet; switched off for people who ask their phone for less motion ---- */
:root{--ease:cubic-bezier(.2,.7,.2,1)}
.orderbar{transform:translateY(110%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s}
.orderbar.show{transform:none;visibility:visible;transition:transform .4s var(--ease)}
.staff{transform:translateY(100%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s}
.staff.open{transform:none;visibility:visible;transition:transform .4s var(--ease)}
.step button{transition:transform .12s,background-color .2s,color .2s}
.step button:active,.catnav .groups button:active,.orderbar button:active,.float button:active{transform:scale(.93)}
.catnav a{transition:color .2s,border-color .25s}
.catnav .groups button{transition:background-color .25s,color .25s}
.float{transition:transform .35s var(--ease),opacity .35s}
.float.away{transform:translateX(72px);opacity:0;pointer-events:none}
@media (prefers-reduced-motion: no-preference){
  header .logo,header h1,header .line{animation:rise .8s var(--ease) both}
  header h1{animation-delay:.12s} header .line{animation-delay:.24s}
  .rv{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .6s var(--ease)}
  .rv.in{opacity:1;transform:none}
  .hero{overflow:hidden}
  .hero img{transform:scale(1.08);transition:transform 1.8s var(--ease)}
  .hero.in img{transform:none}
  .hero .label{opacity:0;transform:translateY(10px);transition:opacity .6s .25s,transform .7s .25s var(--ease)}
  .hero.in .label{opacity:1;transform:none}
  .feature.rv{transform:scale(.97)}
  .feature.rv.in{transform:none}
  .step.pop{animation:pop .28s var(--ease)}
  .step b.bump,#ob-count.bump{display:inline-block;animation:bump .32s var(--ease)}
  .page-in{animation:pagein .4s var(--ease)}
}
@media (prefers-reduced-motion: reduce){
  .orderbar,.staff,.orderbar.show,.staff.open{transition:none}
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{0%{transform:scale(.8);opacity:.4}100%{transform:none;opacity:1}}
@keyframes bump{40%{transform:scale(1.3)}}
@keyframes pagein{from{opacity:0;transform:translateX(var(--dx,24px))}}
</style>
</head>

<header>
  <img class="logo" src="https://www.shoya.com/.assets/trademark-restaurant-risho-honkan.svg" alt="李昇 本館">

  <div class="line"></div>

<nav class="catnav"><div class="groups"><button data-g="food" id="g-food"></button><button data-g="drink" id="g-drink"></button></div><ul id="catnav"></ul></nav>
<main>
  <div id="page-food">

</main>
<div class="float"><span class="fs" role="group" aria-label="Text size"><button data-fs="1" aria-label="Larger text">A+</button><button data-fs="-1" aria-label="Smaller text">A−</button></span><a class="totop" href="#">TOP</a></div>
<div class="orderbar" id="orderbar"><div class="in"><span><span id="ob-count"></span><small id="ob-note"></small></span><button id="ob-show"></button></div></div>
<div class="staff" id="staff"><div class="in">

  <div id="staff-list"></div>

  <p class="donenote" id="staff-donenote"></p>
  <div id="ordered"></div>
</div><div class="btns"><div class="in2"><button id="staff-back"></button><button class="done" id="staff-done"></button><button class="clear" id="staff-clear"></button></div></div></div>
<div class="toast" id="toast" role="status"><span></span><button></button></div>

<script>

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const recIcon = () => `<img class="rec-icon" src="${IMG}menu-recommendation.svg" alt="${esc(L.rec)}">`;

// "1 slice ¥968<br>¥4,048" → main price large, the per-slice line small
function priceHTML(p){
  const parts = p.split(/<br>| \/ /);
  if (parts.length === 2 && /^\D*¥[\d,]+$/.test(parts[1]) && !/^\D*¥[\d,]+$/.test(parts[0]))
    return `${parts[1]}<small>${parts[0]}</small><small class="min">${esc(L.min2)}</small>`;
  return parts.join("<br>");
}

function grillHTML(jp){
  const n = NOTES[jp];
  if (!n) return "";
  const count = n.pcs == null || n.pcs === false ? "" : L.pcs(n.pcs) + (n.vary ? L.vary : "");
  const head = [n.cut ? L[n.cut] : "", count].filter(Boolean).join(" · ");
  return `<div class="grill">${head ? `<b>${esc(head)}</b> — ` : ""}${esc(n[L.lang] || n.en)}</div>`;
}

function itemHTML(it, sec){
  let [name, jp, price, desc, flags, extra] = it;
  if (flags && typeof flags === "object") [flags, extra] = ["", flags];
  const f = typeof flags === "string" ? flags : "";
  if (typeof DESC !== "undefined" && DESC[jp]) desc = DESC[jp];
  let more = "";
  if (sec.course && Array.isArray(extra))
    more = `<ul class="contents">${extra.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  if (sec.wine && extra && extra.o)
    more = `<dl class="meta"><dt>${L.pairs}</dt><dd>${esc(extra.p)}</dd><dt>${L.grapes}</dt><dd>${esc(extra.g)}</dd><dt>${L.aromas}</dt><dd>${esc(extra.a)}</dd></dl>`;
  return `<div class="item">
    ${f.includes("l") ? `<span class="lim">${esc(L.lim)}</span>` : ""}
    <div class="row"><h3>${f.includes("r") ? recIcon() : ""}${esc(name)}</h3>
      <div class="price">${priceHTML(price)}${sec.wine ? `<small>${esc(L.bottle)}</small>` : ""}</div></div>
    <div class="jp" lang="ja">${esc(jp)}</div>
    ${sec.wine && extra && extra.o ? `<div class="origin">${esc(extra.o)}</div>` : ""}
    ${desc ? `<p>${esc(desc)}</p>` : ""}${more}${grillHTML(jp)}${orderHTML(it, sec)}</div>`;
}

const capOf = ([file, cap]) => (typeof PHOTO !== "undefined" && PHOTO[file]) || cap;

function headHTML(sec){
  const label = `<span lang="ja">${esc(sec.sub)}</span><h2>${esc(sec.title)}</h2>`;
  if (sec.photos && sec.photos.length)
    return `<div class="hero"><img loading="lazy" src="${IMG + sec.photos[0][0]}" alt="${esc(sec.photos[0][1])}"><div class="label">${label}</div></div><p class="hero-cap">${esc(L.photo)} <b>${esc(capOf(sec.photos[0]))}</b></p>`;
  return `<div class="plain">${label}</div>`;
}

function render(list, el){
  el.innerHTML = list.map(sec => {
    const feat = L.feature && L.feature[sec.id];
    const more = (sec.photos || []).slice(1);
    return `<section id="${sec.id}">
      ${headHTML(sec)}
      <div class="pad">
        ${(L.leads && L.leads[sec.id]) || sec.lead ? `<p class="lead">${esc((L.leads && L.leads[sec.id]) || sec.lead)}</p>` : ""}
        ${stylesOf(sec).length ? `<p class="styles"><b>${esc(ST.title)}</b>${esc(styleLine(sec))}</p>` : ""}
        ${sec.caution ? `<p class="caution">${esc(sec.caution)}</p>` : ""}
        ${L.notes && L.notes[sec.id] ? `<p class="jnote">${esc(L.notes[sec.id])}</p>` : ""}
        ${feat ? `<div class="feature"><h3>${esc(feat.h)}</h3><p>${esc(feat.p)}</p></div>` : ""}
        ${sec.items.map(it => itemHTML(it, sec)).join("")}
        ${sec.addon ? `<div class="addon">${esc(sec.addon)}</div>` : ""}
        ${more.map(([src, cap]) => `<figure class="photo"><img loading="lazy" src="${IMG + src}" alt=""><figcaption>${esc(L.photo)} <b>${esc(capOf([src, cap]))}</b></figcaption></figure>`).join("")}
        ${hasRec(sec) ? `<p class="sec-legend">${recIcon()}${esc(L.recLegend)}</p>` : ""}
      </div></section>`;
  }).join("");
}


// ---- order list ----
// Each dish (or each size / kind of a dish) becomes one variant with a key; the key uses the
// official Japanese name, so a dish shown in two categories shares one count.
const REG = {};   // key -> {staff, name, yen, min, unit, course, n}
let regN = 0;
const LABEL_JA = {L:"大", M:"中", S:"小", Glass:"グラス", Bottle:"ボトル", "2 pcs":"2個", "4 pcs":"4個"};
const partsOf = price => price.split(/<br>| \/ /).map(p => {
  const m = p.match(/^(.*?)\s*¥([\d,]+)/);
  return {label: m ? m[1].trim() : p.trim(), yen: m ? +m[2].replace(/,/g, "") : 0};
});
// "グラスワイン 赤／白" → ["グラスワイン 赤", "グラスワイン 白"]
function splitJa(jp){
  const ps = jp.split("／"), sp = ps[0].lastIndexOf(" ");
  return sp < 0 ? ps : ps.map((x, i) => i && !x.includes(" ") ? ps[0].slice(0, sp + 1) + x : x);
}
function variantsOf(it, sec){
  const vs = baseVariants(it, sec), st = stylesOf(sec);
  if (!st.length) return vs;
  return vs.flatMap(v => /ボトル|Bottle|瓶|병/.test(v.disp + v.key) ? [{...v, bottle: true}]
    : st.map(k => ({...v, key: `${v.key}|${STAFF_STYLE[k]}`, group: v.key, groupDisp: v.disp,
        staff: `${v.staff.replace(/（(.*)）$/, "")}（${[v.ja, STAFF_STYLE[k]].filter(Boolean).join("・")}）`,
        disp: [v.disp, ST[k]].filter(Boolean).join(" · "), styleName: ST[k]})));
}
function baseVariants(it, sec){
  const [name, jp, price] = it;
  const parts = partsOf(price);
  if (sec.course) return [{key: jp, staff: jp, disp: "", yen: parts[0].yen, min: 2, unit: "guests", course: true}];
  if (parts.length > 1) return parts.sort((a, b) => (/slice|一切れ/.test(a.label)) - (/slice|一切れ/.test(b.label))).map(p => {  // whole plate first
    if (/slice|一切れ/.test(p.label)) return {key: jp + "|slice", staff: jp + "（1枚）", disp: L.bySlice, yen: p.yen, min: 2, unit: "slices"};
    if (!p.label) return {key: jp, staff: jp, disp: L.plate, yen: p.yen};
    const ja = LABEL_JA[p.label] || p.label;
    return {key: jp + "|" + ja, staff: `${jp}（${ja}）`, disp: (L.sizes && L.sizes[p.label]) || p.label, yen: p.yen, ja};
  });
  if (jp.includes("／")) {
    const js = splitJa(jp), ds = name.split(L.lang === "ja" ? "／" : " / ");
    return js.map((j, i) => ({key: j, staff: j, disp: ds.length === js.length ? ds[i] : j, yen: parts[0].yen, split: true}));
  }
  return [{key: jp, staff: jp, disp: "", yen: parts[0].yen}];
}
const stepHTML = key => `<span class="step" data-key="${esc(key)}"></span>`;
// ORDERING = false builds the plain menu (no + Add, no order list)
const ORDERING = typeof ORDER === "undefined" || ORDER;
function orderHTML(it, sec){
  if (!ORDERING) return "";
  const vs = variantsOf(it, sec);
  // a dish listed under "Special Dishes" is ordered from its own category, so it takes that position
  vs.forEach(v => {
    const r = REG[v.key];
    if (!r) REG[v.key] = {...v, name: v.split ? v.disp : it[0] + (v.disp ? ` — ${v.disp}` : ""), n: regN++, special: sec.id === "special"};
    else if (r.special && sec.id !== "special") Object.assign(r, {n: regN++, special: false});
  });
  if (vs.some(v => v.group)) {
    // styled drink: tap a style to add a glass; each chosen style then gets its own row
    const groups = [...new Set(vs.map(v => v.group || v.key))];
    return `<div class="vrows">${groups.map(g => {
      const gv = vs.filter(v => (v.group || v.key) === g);
      if (!gv[0].group) {  // a bottle
        const b = gv[0];
        return `<div class="vrow"><span>${esc(b.disp)}<small>¥${b.yen.toLocaleString()}</small></span>${stepHTML(b.key)}</div>
          ${ST.bottleHint ? `<p class="hint">${esc(ST.bottleHint)} <a href="#bottle-set" class="jump">${esc(ST.bottleSet)}</a></p>` : ""}`;
      }
      return `<div class="vrow"><span>${esc(gv[0].groupDisp || "")}<small>¥${gv[0].yen.toLocaleString()}</small></span></div>
        <div class="chips">${gv.map(v => `<button data-act="addkey" data-key="${esc(v.key)}">+ ${esc(v.styleName)}</button>`).join("")}</div>
        ${gv.map(v => `<div class="vrow st" data-k="${esc(v.key)}" hidden><span>${esc(v.styleName)}</span>${stepHTML(v.key)}</div>`).join("")}`;
    }).join("")}</div>`;
  }
  if (vs.length === 1 && !vs[0].disp) return `<div class="order">${stepHTML(vs[0].key)}</div>`;
  return `<div class="vrows">${vs.map(v => `<div class="vrow"><span>${esc(v.disp)}<small>¥${v.yen.toLocaleString()}${v.unit === "slices" ? ` · ${esc(L.min2)}` : ""}</small></span>${stepHTML(v.key)}</div>`).join("")}</div>`;
}

try { cart = JSON.parse(localStorage.getItem("risho-order") || "{}"); } catch (_) {}
const save = () => { try { localStorage.setItem("risho-order", JSON.stringify(cart)); } catch (_) {} };
const lines = () => Object.keys(cart).filter(k => REG[k] && cart[k] > 0).sort((a, b) => REG[a].n - REG[b].n);
const qtyText = (k, q) => REG[k].unit === "guests" ? `× ${q}名` : REG[k].unit === "slices" ? `× ${q}枚` : `× ${q}`;

// Already ordered: when staff tap "注文済みにする", the list moves here, so the next order starts
// from an empty list but the guest can still see what they have ordered. Forgotten after 6 hours.
let ordered = [];
try { ordered = JSON.parse(localStorage.getItem("risho-ordered") || "[]"); } catch (_) {}
if (!Array.isArray(ordered) || (ordered.length && Date.now() - ordered[ordered.length - 1].t > 6 * 3600e3)) ordered = [];
const saveOrdered = () => { try { localStorage.setItem("risho-ordered", JSON.stringify(ordered)); } catch (_) {} };
const hhmm = t => { const d = new Date(t); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; };
function drawOrdered(){
  const rounds = ordered.map(r => ({t: r.t, items: r.items,
    keys: Object.keys(r.items || {}).filter(k => REG[k] && r.items[k] > 0).sort((a, b) => REG[a].n - REG[b].n)})).filter(r => r.keys.length);
  const el = document.getElementById("ordered");
  if (!rounds.length) { el.innerHTML = ""; return 0; }
  const sum = rounds.reduce((t, r) => t + r.keys.reduce((u, k) => u + REG[k].yen * r.items[k], 0), 0);
  el.innerHTML = `<h3>${esc(L.orderedTitle)}</h3>` + rounds.map((r, i) => `<p class="round">${esc(L.round(i + 1))} · ${hhmm(r.t)}</p>` +
      r.keys.map(k => `<div class="srow"><div class="sj">${esc(REG[k].staff)}</div><div class="q">${qtyText(k, r.items[k])}</div>
        <div class="se"><span>${esc(REG[k].name)}</span></div></div>`).join("")).join("") +
    `<p class="total">${esc(L.orderedTotal)} ¥${sum.toLocaleString()}<small>${esc(L.totalNote)}</small></p>` +
    `<button class="linkbtn" id="ordered-clear">${esc(L.clearOrdered)}</button>`;
  return rounds.reduce((t, r) => t + r.keys.length, 0);
}
let toastTimer;
function toast(msg, onUndo){
  const t = document.getElementById("toast");
  t.querySelector("span").textContent = msg;
  t.querySelector("button").textContent = L.undo;
  t.querySelector("button").onclick = () => { clearTimeout(toastTimer); t.classList.remove("show"); onUndo(); };
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 6000);
}

let shown = {};  // counts drawn last time
function refresh(){
  const ls = lines();
  document.getElementById("staff-list").innerHTML = ls.map(k => `<div class="srow">
      <div class="sj">${esc(REG[k].staff)}</div><div class="q">${qtyText(k, cart[k])}</div>
      <div class="se"><span>${esc(REG[k].name)}</span>${stepHTML(k)}</div></div>`).join("") || `<p class="sub">${esc(L.empty)}</p>`;
  document.querySelectorAll(".vrow[data-k]").forEach(r => r.hidden = !(cart[r.dataset.k] > 0));
  document.querySelectorAll(".step").forEach(el => {
    const q = cart[el.dataset.key] || 0;
    const inStaff = !!el.closest("#staff");
    el.classList.toggle("on", q > 0);
    el.innerHTML = q ? `<button class="pm" data-act="dec" aria-label="−">−</button>${inStaff ? "" : `<b>${q}</b>`}<button class="pm" data-act="inc" aria-label="+">+</button>`
                     : `<button class="addbtn" data-act="add">${esc(L.add)}</button>`;
    const before = shown[el.dataset.key] || 0;
    if (!inStaff && q !== before) {
      if (!before || !q) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
      else el.querySelector("b").classList.add("bump");
    }
  });
  const countChanged = lines().length !== Object.keys(shown).filter(k => shown[k] > 0).length;
  shown = {...cart};
  const nOrdered = drawOrdered();
  const any = ls.length > 0 || nOrdered > 0;
  document.getElementById("orderbar").classList.toggle("show", any);
  document.body.classList.toggle("has-order", any);
  const obc = document.getElementById("ob-count");
  obc.textContent = ls.length ? L.inList(ls.length) : L.barOrdered(nOrdered);
  document.getElementById("ob-note").textContent = ls.length ? L.barNote : "";
  document.getElementById("ob-show").textContent = ls.length ? L.showStaff : L.viewOrdered;
  if (countChanged) { obc.classList.remove("bump"); void obc.offsetWidth; obc.classList.add("bump"); }
  const total = ls.reduce((t, k) => t + REG[k].yen * cart[k], 0);
  document.getElementById("staff-total").innerHTML = ls.length ? `${esc(L.total)} ¥${total.toLocaleString()}<small>${esc(L.totalNote)}</small>` : "";
  ["staff-done", "staff-clear", "staff-donenote", "staff-notmo"].forEach(id => document.getElementById(id).hidden = !ls.length);
  save();
}

document.addEventListener("click", e => {
  const j = e.target.closest("a.jump");
  if (j) { e.preventDefault(); goTo(document.getElementById(j.getAttribute("href").slice(1))); return; }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "addkey") { cart[b.dataset.key] = (cart[b.dataset.key] || 0) + 1; refresh(); return; }
  const key = b.closest(".step").dataset.key, v = REG[key], min = v.min || 1, q = cart[key] || 0;
  if (b.dataset.act === "add") {
    if (v.course) Object.keys(cart).forEach(k => { if (REG[k] && REG[k].course) delete cart[k]; });  // one course per table
    cart[key] = min;
  } else if (b.dataset.act === "inc") cart[key] = q + 1;
  else if (q - 1 < min) delete cart[key];
  else cart[key] = q - 1;
  refresh();
});
const staff = document.getElementById("staff");
document.getElementById("ob-show").addEventListener("click", () => { staff.classList.add("open"); staff.scrollTop = 0; });
document.getElementById("staff-back").addEventListener("click", () => { staff.classList.remove("open"); });
document.getElementById("staff-clear").addEventListener("click", () => {
  if (!confirm(L.clearAsk)) return;
  cart = {}; refresh(); staff.classList.remove("open");
});
// staff tap this after entering the order: the list moves to "Already ordered" (with undo)
document.getElementById("staff-done").addEventListener("click", () => {
  if (!lines().length) return;
  const round = {t: Date.now(), items: {...cart}}, before = cart;
  ordered.push(round); saveOrdered();
  cart = {}; refresh();
  staff.scrollTop = 0;
  toast(L.doneToast, () => { ordered = ordered.filter(r => r !== round); saveOrdered(); cart = before; refresh(); });
});
document.getElementById("ordered").addEventListener("click", e => {
  if (!e.target.closest("#ordered-clear") || !confirm(L.clearOrderedAsk)) return;
  ordered = []; saveOrdered(); refresh();
});

document.documentElement.lang = L.lang;
document.title = L.title;
document.querySelector("header h1").textContent = L.h1;
document.getElementById("howto-title").textContent = L.howtoTitle;
document.getElementById("howto").innerHTML = L.howto.map(t => `<li>${esc(t)}</li>`).join("");
document.getElementById("legend").innerHTML = `${recIcon()}<span>${esc(L.legendText)}</span>`;
document.getElementById("food-title").textContent = L.food;
document.getElementById("drink-title").textContent = L.drink;
document.getElementById("footer").textContent = L.footer;
render(FOOD, document.getElementById("food"));
render(DRINK, document.getElementById("drink"));
document.getElementById("howorder-title").textContent = L.howOrderTitle;
document.getElementById("howorder").innerHTML = L.howOrder.map(t => `<li>${esc(t)}</li>`).join("");
document.getElementById("notmo").textContent = L.notMobile;
document.getElementById("howorder-alt").textContent = L.orderAlt;
document.getElementById("staff-notmo").textContent = L.notSent;
document.getElementById("ob-note").textContent = L.barNote;
document.getElementById("ob-show").textContent = L.showStaff;
document.getElementById("staff-title").textContent = L.staffTitle;
document.getElementById("staff-sub").textContent = L.staffSub;
document.getElementById("staff-back").textContent = L.back;
document.getElementById("staff-clear").textContent = L.clear;
document.getElementById("staff-done").innerHTML = `${esc(L.done)}<small>${esc(L.doneSub)}</small>`;
document.getElementById("staff-donenote").textContent = L.doneNote;
if (ORDERING) refresh();
else document.querySelectorAll(".howorder,#orderbar,#staff,#toast").forEach(el => el.remove());

// category nav: JS scrolling (hash jumps don't work in every viewer), highlight the section on screen
const short = t => t.replace(/ \(.*\)/, "").replace(/（.*）/, "");
const nav = document.getElementById("catnav");
// two rows: Food / Drinks switch on top, the chosen group's categories below
const bar = document.querySelector(".catnav");
const chip = g => s => `<li data-g="${g}"><a href="#${s.id}">${esc(short(s.title))}</a></li>`;
nav.innerHTML = FOOD.map(chip("food")).join("") + DRINK.map(chip("drink")).join("");
let group = "";
// Food and Drinks are two pages: switching shows one and hides the other
function showGroup(g){
  if (g === group) return;
  const first = !group;
  group = g;
  nav.querySelectorAll("li").forEach(li => li.hidden = li.dataset.g !== g);
  bar.querySelectorAll(".groups button[data-g]").forEach(b => b.classList.toggle("on", b.dataset.g === g));
  const shownPage = document.getElementById("page-" + g);
  document.getElementById("page-food").hidden = g !== "food";
  document.getElementById("page-drink").hidden = g !== "drink";
  if (!first) {
    shownPage.style.setProperty("--dx", g === "drink" ? "28px" : "-28px");
    shownPage.classList.remove("page-in"); void shownPage.offsetWidth; shownPage.classList.add("page-in");
  }
  nav.scrollLeft = 0;
}
const goTo = el => window.scrollTo({top: el.getBoundingClientRect().top + scrollY - bar.offsetHeight - 4, behavior: "smooth"});
document.getElementById("g-food").textContent = L.food;
document.getElementById("g-drink").textContent = L.drink;
bar.querySelector(".groups").addEventListener("click", e => {
  const b = e.target.closest("button[data-g]"); if (!b) return;
  showGroup(b.dataset.g);
  window.scrollTo({top: 0});
});
// text size: A− / A+ (16px body text by default), remembered on this phone
const FS = [0.94, 1, 1.07, 1.13, 1.2, 1.27, 1.33];
let fsI = 2;
try { const v = +localStorage.getItem("risho-fs"); if (FS.includes(v)) fsI = FS.indexOf(v); } catch (_) {}
const applyFs = () => document.documentElement.style.setProperty("--fs", FS[fsI]);
applyFs();
document.querySelector(".float .fs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  fsI = Math.min(FS.length - 1, Math.max(0, fsI + +b.dataset.fs));
  applyFs();
  try { localStorage.setItem("risho-fs", FS[fsI]); } catch (_) {}
});
showGroup("food");
nav.addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  e.preventDefault();
  goTo(document.getElementById(a.getAttribute("href").slice(1)));
});
const links = [...nav.querySelectorAll("a")];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
  const a = nav.querySelector("a.active");
  if (a) nav.scrollTo({left: a.parentElement.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2, behavior: "smooth"});
}), {rootMargin: "-40% 0px -55% 0px"});
document.querySelectorAll("section").forEach(s => io.observe(s));
// the floating A+/A−/TOP buttons sit over the right edge (prices, + Add), so they
// slide out of the way while scrolling down and come back when scrolling up or near the top
const float = document.querySelector(".float");
let lastY = scrollY;
addEventListener("scroll", () => {
  const y = scrollY;
  if (Math.abs(y - lastY) < 6) return;
  float.classList.toggle("away", y > lastY && y > 200);
  lastY = y;
}, {passive: true});
const reveal = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("in"); reveal.unobserve(e.target); }
}), {rootMargin: "0px 0px -8% 0px"});
document.querySelectorAll(".howto,.legend,.howorder,.group-title,.hero,.plain,.lead,.jnote,.feature,.item,.photo,.addon").forEach(el => {
  el.classList.add("rv"); reveal.observe(el);
});
document.querySelectorAll(".hero").forEach(el => el.classList.remove("rv"));  // the photo zooms instead of sliding
document.querySelector(".totop").addEventListener("click", e => { e.preventDefault(); scrollTo({top: 0, behavior: "smooth"}); });
</script>
</body>
