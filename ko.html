.body{flex:1;min-height:0;margin-top:3mm}

      {o:"일본 나가노현 / 호쿠신 지구 · 드라이",p:"특선 설로인 와사비구이, 아부리 초밥 2개 (희소 살코기)",g:"샤르도네 100%",a:"열대 과일, 버터, 견과류"}],
    ["Kenzo Estate “asatsuyu”","ケンゾー エステート あさつゆ","¥24,200","생기 있는 산미가 돋보이며 밝고 상쾌한 청량감과 함께 응축된 신선한 과일 맛이 느껴지는 풀바디. 풍성한 여운이 길게 남으며 입안에 기분 좋은 청량감을 줍니다.",
      {o:"미국 캘리포니아 · 드라이",p:"소금 특선 우설, 모둠 구운 채소와 버섯",g:"소비뇽 블랑 90% / 세미용 10%",a:"시트러스, 라임, 백도"}],
  ]},
  {id:"champagne", title:"샴페인", sub:"シャンパン", wine:true, items:[
    ["Champagne Piper-Heidsieck Brut","シャンパーニュ パイパー・エドシック ブリュット","¥13,200","마리 앙투아네트 왕비에게 헌상되고 마릴린 먼로가 사랑한 샴페인. 부드럽고 균형 잡힌 과일 맛이 특징인 우아하고 매혹적인 샴페인.",
      {o:"프랑스 샹파뉴 · 드라이",p:"설로인 한 장 구이, 특선 안창살",g:"피노 누아 위주 / 뫼니에 / 샤르도네",a:"서양배, 사과, 아몬드"}],
    ["Champagne Charles Heidsieck Brut Réserve","シャンパーニュ シャルル・エドシック ブリュット レゼルヴ","¥18,700","1859년 보르도 만국박람회 금상. 아이젠하워, 처칠, 달리 등이 소중한 손님을 대접할 때 선택했습니다. 끊임없이 이어지는 섬세한 기포와 매우 복합적이고 식욕을 돋우는 아로마.",
      {o:"프랑스 샹파뉴 · 드라이",p:"아부리 초밥 2개 (희소 살코기), 설로인 한 장 구이, 특선 안창살",g:"샤르도네 40% / 피노 누아 40% / 뫼니에 20%",a:"망고, 살구, 피스타치오"}],
  ]},
  {id:"glass-wine", title:"글라스 와인", sub:"グラスワイン", items:[
    ["글라스 스파클링","グラススパークリング","¥1,078"],
    ["글라스 와인 레드 / 화이트","グラスワイン 赤／白","각 ¥968"],
  ]},
];

// Courses first (recommended), then the order of the current official PDF (Risho_Honkan_WebMenu_EN.pdf). With the short
// descriptions added, its denser pages are split in two so the text stays readable on a phone.
const CLASSIC_TITLES = {
  en: ["Course Menu", "Chef's Recommendations", "Sashimi & Sushi", "Vegetables & Kimchi", "Salt-Seasoned", "Fresh Wasabi & Steak", "Sauce-Marinated", "Rare Lean Wagyu", "Sea Urchin, Liver & Miso", "Grilled Vegetables & Stone-Pot Rice", "Rice", "Soups & Noodles", "Desserts", "Drinks", "Drinks", "Red Wine", "Red Wine", "White Wine & Champagne"],
  ja: ["コース", "料理長のおすすめ", "刺身・寿司", "生野菜・キムチ", "塩味の料理", "生わさび・ステーキ", "たれ味の料理", "希少な和牛の赤身", "うにく・レバー・味噌", "焼き野菜・石焼き", "ご飯もの", "スープ・麺", "デザート", "ドリンク", "ドリンク", "赤ワイン", "赤ワイン", "白ワイン・シャンパン"],
  "zh-Hans": ["套餐", "主厨推荐", "刺身・寿司", "新鲜蔬菜・泡菜", "盐味", "鲜山葵・牛排", "酱汁腌制", "稀有赤身和牛", "海胆与牛肉・牛肝・味噌", "烤蔬菜・石锅", "米饭", "汤类・面类", "甜品", "饮品", "饮品", "红葡萄酒", "红葡萄酒", "白葡萄酒・香槟"],
  ko: ["코스요리", "셰프 추천", "회・초밥", "생야채・김치", "소금", "생와사비・스테이크", "양념", "와규 희소 살코기", "우니쿠・간・된장", "구운 야채・돌솥", "밥", "국물요리・면요리", "디저트", "음료", "음료", "레드 와인", "레드 와인", "화이트 와인・샴페인"],
};
const CLASSIC = [
  ["course"], ["special"], ["sashimi", "sushi"], ["vegetables", "pickles"], ["shio"], ["wasabi", "steak"],
  ["tare"], ["lean"], ["uniku", "liver", "miso"], ["sausage", "grilled-veg", "ishiyaki", "unimeshi"], ["rice"],
  ["soup", "noodles"], ["dessert"],
  ["beer", "tea-hi", "chu-hi", "fruit", "whisky", "bottle-set"], ["makgeolli", "sake", "shochu", "soft"],
  ["red-wine:0-4"], ["red-wine:4-8"], ["white-wine", "champagne", "glass-wine"],
].map((secs, i) => ({title: CLASSIC_TITLES[L.lang][i], secs}));
// this version keeps only the official descriptions: undo the lines added for the new design
// (in English they live apart in DESC, so only the Japanese check copy needs this)
if (L.lang === "ja") FOOD.forEach(s => s.items.forEach(it => {
  if (typeof it[3] !== "string") return;
  it[3] = it[3].replace("海苔で巻いてお召し上がりください。", "");
  if (it[1] === "生塩タンアゴ") it[3] = "コリコリの食感と溢れる旨み。アゴが外れる美味しさ。";
}));
const CLASSIC_TEXT = {
  en: {foot: "All prices include tax. Show the Japanese name to staff when ordering.", each: "each", min2: "Min. 2 slices"},
  ja: {foot: "価格はすべて税込です。ご注文の際は日本語の品名をスタッフにお見せください。", each: "各", min2: "2枚からご注文いただけます"},
  "zh-Hans": {foot: "价格均含税。点餐时请向员工出示日文菜名。", each: "每款", min2: "2片起点", cjk: "Noto Serif SC"},
  ko: {foot: "가격은 모두 세금 포함입니다. 주문 시 일본어 메뉴명을 직원에게 보여 주세요.", each: "각", min2: "2점부터 주문 가능", cjk: "Noto Serif KR"},
}[L.lang];
L.classicFoot = CLASSIC_TEXT.foot;
L.each = CLASSIC_TEXT.each;
L.min2 = L.min2 || CLASSIC_TEXT.min2;
if (CLASSIC_TEXT.cjk) L.cjk = CLASSIC_TEXT.cjk;

// How a drink is served (fruit liqueur, shochu, whisky): shown on every menu,
// and on the order-list version the guest picks one when adding a glass.
const STYLED = {fruit: "std", shochu: "std", whisky: "whisky"};  // section id -> set of styles
const STYLE_SETS = {std: ["rock", "water", "hot", "soda"], whisky: ["rock", "water", "hot", "highball"]};
const STYLE_TEXT = {
  en: {title: "How would you like it?", rock: "On the rocks", water: "With water", hot: "With hot water", soda: "With soda", highball: "Highball",
       bottleHint: "For a bottle, mixers are on the", bottleSet: "Bottle Set"},
  ja: {title: "飲み方", rock: "ロック", water: "水割り", hot: "お湯割り", soda: "ソーダ割り", highball: "ハイボール",
       bottleHint: "ボトルの割り材は", bottleSet: "ボトルセット"},
  "zh-Hans": {title: "饮用方式", rock: "加冰", water: "兑水", hot: "兑热水", soda: "兑苏打水", highball: "嗨棒（兑苏打水）"},
  ko: {title: "드시는 방법", rock: "온더록", water: "물 타서", hot: "뜨거운 물 타서", soda: "소다 타서", highball: "하이볼"},
};
const ST = STYLE_TEXT[L.lang] || STYLE_TEXT.en;
const STAFF_STYLE = STYLE_TEXT.ja;  // the staff screen is always in Japanese
const stylesOf = sec => (STYLE_SETS[STYLED[sec.id]] || []);
const styleLine = sec => stylesOf(sec).map(k => ST[k]).join(" / ");


// courses come first on every menu
FOOD.sort((a, b) => (b.id === "course") - (a.id === "course"));

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SEC = Object.fromEntries([...FOOD, ...DRINK].map(s => [s.id, s]));
const rec = `<img src="${IMG}menu-recommendation.svg" alt="${esc(L.rec)}">`;

function rowHTML(it, sec){
  let [name, jp, price, desc, flags, extra] = it;
  if (flags && typeof flags === "object") [flags, extra] = ["", flags];
  const f = typeof flags === "string" ? flags : "";
  // the short description from the official Japanese menu (translated); courses list their dishes,
  // wines show origin + description. Texts added for the new design (DESC in en-v2.js) are not used here.
  const x = sec.course && Array.isArray(extra) ? extra.join(", ")
          : sec.wine && extra ? [extra.o, desc].filter(Boolean).join(" — ")
          : desc || "";
  // "1 slice ¥968<br>¥4,048": the whole plate large, the per-slice price small with "min. 2"
  const parts = price.split("<br>");
  const p = parts.length === 2 && /^¥[\d,]+$/.test(parts[1])
    ? `${parts[1]}<small>${parts[0]}${/slice|一切れ|片|점/.test(parts[0]) && L.min2 ? ` · ${L.min2}` : ""}</small>` : parts.join("<br>");
  return `<div class="row"><div><div class="n">${f.includes("r") ? rec : ""}${esc(name)}${f.includes("l") ? `<span class="lim">${esc(L.lim)}</span>` : ""}</div>
    <div class="j" lang="ja">${esc(jp)}</div>${x ? `<div class="x">${esc(x)}</div>` : ""}</div>
    <div class="p">${p}${sec.wine ? `<small>${esc(L.bottle)}</small>` : ""}</div></div>`;
}

// drinks: neighbouring items with the same price and no description share one row
// ("Fresh Lemon Sour / Fresh Orange Sour … each ¥858"), as on the current PDF
function compact(sec){
  if (sec.wine || !DRINK.some(d => d.id === sec.id)) return sec.items;
  const out = [];
  for (const it of sec.items) {
    const last = out[out.length - 1];
    if (last && !it[3] && !last[3] && last[2].replace(/^\S+ (?=¥)/, "") === it[2] && !/<br>/.test(it[2]))
      out[out.length - 1] = [`${last[0]} / ${it[0]}`, `${last[1]}／${it[1]}`, `${L.each} ${it[2]}`];
    else out.push(it);
  }
  return out;
}

const total = CLASSIC.length;
document.getElementById("pages").innerHTML = CLASSIC.map((pg, i) => `<section class="page">
  <div class="top"><img src="${IMG}trademark-restaurant-risho-honkan.svg" alt="李昇 本館"><div class="store">${esc(L.h1)}<br>Menu</div></div>
  <h1>${esc(pg.title)}</h1>
  <div class="body">${pg.secs.map(ref => {
    // "red-wine:0-4" = items 0..3 of a section that is split over two pages
    const [id, range] = ref.split(":"), whole = SEC[id];
    const [a, z] = range ? range.split("-").map(Number) : [0, whole.items.length];
    const s = {...whole, items: whole.items.slice(a, z)};
    const head = pg.secs.length > 1 ? `<h2>${esc(s.title)}<span lang="ja">${esc(s.sub.split(" · ")[0])}</span></h2>` : "";
    const st = stylesOf(s).length ? `<div class="styles">${esc(ST.title)}：${esc(styleLine(s))}</div>` : "";
    return head + st + compact(s).map(it => rowHTML(it, s)).join("");
  }).join("")}</div>
  <div class="foot"><span>${rec} ${esc(L.rec)} · ${esc(L.classicFoot)}</span><span>${i + 1} / ${total}</span></div>
</section>`).join("");

document.documentElement.lang = L.lang;
if (L.cjk) document.documentElement.style.setProperty("--cjk", `"${L.cjk}"`);
document.title = L.title;
// shrink a page's text until its list fits the page
function fit(){
  document.querySelectorAll(".page").forEach(pg => {
    let k = 1;
    pg.style.setProperty("--k", k);
    const body = pg.querySelector(".body");
    while (body.scrollHeight > body.clientHeight + 1 && k > 0.7) {
      k = Math.round((k - 0.02) * 100) / 100;
      pg.style.setProperty("--k", k);
    }
  });
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(fit);
</script>
</body>
</html>
